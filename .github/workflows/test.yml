name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No install step: the suite deliberately uses only Node built-ins, so
      # there is nothing to fetch and nothing that can break from a bad lockfile.
      - run: npm test
